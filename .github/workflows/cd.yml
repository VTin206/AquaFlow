name: AquaFlow CD - publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  validate-backend:
    name: Validate backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aquaflow_test
          POSTGRES_USER: aquaflow_test
          POSTGRES_PASSWORD: aquaflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquaflow_test -d aquaflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DB_URL: jdbc:postgresql://localhost:5432/aquaflow_test
      DB_USERNAME: aquaflow_test
      DB_PASSWORD: aquaflow_test
      SPRING_PROFILES_ACTIVE: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify backend
        run: mvn -B -ntp clean verify

  validate-frontend:
    name: Validate frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Frontend tests
        run: npm test

  prepare:
    name: Prepare image metadata
    runs-on: ubuntu-latest
    needs: [validate-backend, validate-frontend]
    outputs:
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - id: owner
        name: Normalize GHCR owner
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  publish-backend:
    name: Publish backend image
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner }}/aquaflow-backend:sha-${{ github.sha }}
            ghcr.io/${{ needs.prepare.outputs.owner }}/aquaflow-backend:latest
          cache-from: type=gha,scope=aquaflow-backend
          cache-to: type=gha,mode=max,scope=aquaflow-backend

  publish-frontend:
    name: Publish frontend image
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner }}/aquaflow-frontend:sha-${{ github.sha }}
            ghcr.io/${{ needs.prepare.outputs.owner }}/aquaflow-frontend:latest
          cache-from: type=gha,scope=aquaflow-frontend
          cache-to: type=gha,mode=max,scope=aquaflow-frontend
