spring:
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: aquaflow-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # Nạp quan hệ lazy theo nhóm (IN (...)) thay vì từng bản ghi một: database ở xa thì mỗi lượt đi về đều đắt.
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  # Backend chạy sau nginx: lấy IP khách từ X-Forwarded-For (chỉ tin proxy trong mạng nội bộ)
  # để giới hạn đăng nhập/tra cứu đơn tính theo từng khách, không dồn chung IP của nginx.
  forward-headers-strategy: native
  error:
    include-message: always

app:
  password-reset:
    enabled: ${PASSWORD_RESET_ENABLED:false}
    from: ${SMTP_FROM:}
    frontend-url: ${FRONTEND_URL:}
  jwt:
    secret: ${APP_JWT_SECRET:}
    # Access token ngắn hạn; trình duyệt tự xin token mới bằng refresh token (cookie HttpOnly).
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
  refresh-token:
    # Phiên tự kết thúc nếu không dùng trong chừng này ngày.
    days: ${REFRESH_TOKEN_DAYS:14}
    secure-cookie: ${REFRESH_COOKIE_SECURE:true}
