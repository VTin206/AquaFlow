services:
  postgres:
    image: postgres:16-alpine
    container_name: aquaflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aquaflow
      POSTGRES_USER: aquaflow
      POSTGRES_PASSWORD: aquaflow
    ports:
      - "5432:5432"
    volumes:
      - aquaflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquaflow -d aquaflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aquaflow-postgres-data:
