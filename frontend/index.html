<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#087fad" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="AquaFlow — quản lý bán hàng, kho hàng và giao nhận cho đại lý nước tinh khiết." />
    <title>AquaFlow | Quản lý đại lý nước</title>
    <script>
      // Màn hình chờ theo chế độ màu đã lưu (cùng khóa với app/colorMode.ts). Không dùng data-theme: thuộc tính đó do ThemedArea quản lý.
      try {
        var afMode = localStorage.getItem('aquaflow.color-mode')
        if (afMode === 'dark' || (afMode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-startup-theme', 'dark')
        }
      } catch (e) {}
    </script>
    <style>
      /* Màn hình chờ: hiện trước khi có bundle nên phải nằm ngay trong trang. Màu chép từ app/palette.ts. */
      body {
        margin: 0;
      }
      .af-startup {
        --s-bg: #f4f7fb;
        --s-strong: #16324f;
        --s-text: #52687b;
        --s-track: #e1e9f1;
        --s-accent: #087fad;
        align-items: center;
        background: var(--s-bg);
        box-sizing: border-box;
        color: var(--s-text);
        display: flex;
        font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
        justify-content: center;
        line-height: 1.55;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 24px 16px;
        text-align: center;
      }
      html[data-startup-theme='dark'] .af-startup {
        --s-bg: #0a0f1a;
        --s-strong: #e2e8f0;
        --s-text: #94a3b8;
        --s-track: #273042;
        --s-accent: #3aa6d6;
      }
      html[data-startup-theme='dark'] body {
        background: #0a0f1a;
      }
      .af-startup-body {
        align-items: center;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .af-startup-brand {
        align-items: center;
        color: var(--s-strong);
        display: flex;
        font-size: 22px;
        font-weight: 700;
        gap: 10px;
      }
      .af-startup-mark {
        align-items: center;
        background: #087fad;
        border-radius: 12px;
        color: #fff;
        display: flex;
        height: 38px;
        justify-content: center;
        width: 38px;
      }
      .af-startup-mark svg {
        fill: none;
        height: 22px;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2.2;
        width: 22px;
      }
      .af-startup-spinner {
        animation: af-startup-spin 0.8s linear infinite;
        border: 2.5px solid var(--s-track);
        border-radius: 50%;
        border-top-color: var(--s-accent);
        box-sizing: border-box;
        height: 24px;
        margin-top: 22px;
        width: 24px;
      }
      /* Chỉ hiện khi tải quá lâu; đặt tuyệt đối để logo luôn ở giữa màn hình. */
      .af-startup-message {
        animation: af-startup-reveal 0.2s ease 8s both;
        font-size: 13px;
        left: 50%;
        margin-top: 16px;
        position: absolute;
        top: 100%;
        transform: translateX(-50%);
        width: min(320px, calc(100vw - 32px));
      }
      .af-startup-message p {
        margin: 0 0 8px;
      }
      .af-startup-message a {
        color: var(--s-accent);
        font-weight: 500;
      }
      .af-startup[data-state='failed'] .af-startup-spinner {
        display: none;
      }
      .af-startup[data-state='failed'] .af-startup-message {
        animation: none;
      }
      .af-startup[data-state='failed'] #af-startup-title {
        color: var(--s-strong);
        font-size: 15px;
        font-weight: 600;
      }
      @keyframes af-startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes af-startup-reveal {
        from {
          opacity: 0;
          visibility: hidden;
        }
        to {
          opacity: 1;
          visibility: visible;
        }
      }
    </style>
    <noscript>
      <style>
        .af-startup-spinner {
          visibility: hidden;
        }
        .af-startup-message {
          animation: none;
        }
        .af-startup-message p:not(.af-startup-noscript),
        .af-startup-message a {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root">
      <main class="af-startup" id="af-startup">
        <div class="af-startup-body">
          <div class="af-startup-brand">
            <span class="af-startup-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1" />
                <path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1" />
                <path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1" />
              </svg>
            </span>
            AquaFlow
          </div>
          <div class="af-startup-spinner" role="status" aria-label="Đang tải"></div>
          <div class="af-startup-message" role="status">
            <p id="af-startup-title">Vẫn đang tải…</p>
            <p id="af-startup-description">Hãy kiểm tra kết nối mạng hoặc thử tải lại trang.</p>
            <a href="">Tải lại trang</a>
            <noscript><p class="af-startup-noscript">Bạn cần bật JavaScript trong trình duyệt để sử dụng AquaFlow.</p></noscript>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
