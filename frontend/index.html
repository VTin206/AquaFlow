<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#087fad" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="AquaFlow — quản lý bán hàng, kho hàng và giao nhận cho đại lý nước tinh khiết." />
    <title>AquaFlow | Quản lý đại lý nước</title>
    <script>
      // Nền trang theo chế độ màu đã lưu (cùng khóa với app/colorMode.ts). Không dùng data-theme: thuộc tính đó do ThemedArea quản lý.
      try {
        var afMode = localStorage.getItem('aquaflow.color-mode')
        if (afMode === 'dark' || (afMode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-startup-theme', 'dark')
        }
      } catch (e) {}
    </script>
    <style>
      /* Không có màn hình chờ: chỉ đặt nền để khỏi chớp trắng; thông báo dưới đây chỉ hiện khi không tải được app. */
      body {
        background: #f4f7fb;
        margin: 0;
      }
      html[data-startup-theme='dark'] body {
        background: #0a0f1a;
      }
      .af-startup-message {
        animation: af-startup-reveal 0.2s ease 8s both;
        color: #52687b;
        font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 13px;
        left: 50%;
        line-height: 1.55;
        position: fixed;
        text-align: center;
        top: 40%;
        transform: translateX(-50%);
        width: min(320px, calc(100vw - 32px));
      }
      html[data-startup-theme='dark'] .af-startup-message {
        color: #94a3b8;
      }
      .af-startup-message p {
        margin: 0 0 8px;
      }
      .af-startup-message a {
        color: #087fad;
        font-weight: 500;
      }
      .af-startup-message[data-state='failed'] {
        animation: none;
      }
      @keyframes af-startup-reveal {
        from {
          opacity: 0;
          visibility: hidden;
        }
        to {
          opacity: 1;
          visibility: visible;
        }
      }
    </style>
    <noscript>
      <style>
        .af-startup-message {
          animation: none;
        }
        .af-startup-message p:not(.af-startup-noscript),
        .af-startup-message a {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root">
      <div class="af-startup-message" id="af-startup" role="status">
        <p id="af-startup-title">Vẫn đang tải…</p>
        <p id="af-startup-description">Hãy kiểm tra kết nối mạng hoặc thử tải lại trang.</p>
        <a href="">Tải lại trang</a>
        <noscript><p class="af-startup-noscript">Bạn cần bật JavaScript trong trình duyệt để sử dụng AquaFlow.</p></noscript>
      </div>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
