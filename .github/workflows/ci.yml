name: AquaFlow CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aquaflow_test
          POSTGRES_USER: aquaflow_test
          POSTGRES_PASSWORD: aquaflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquaflow_test -d aquaflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DB_URL: jdbc:postgresql://localhost:5432/aquaflow_test
      DB_USERNAME: aquaflow_test
      DB_PASSWORD: aquaflow_test
      SPRING_PROFILES_ACTIVE: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check dependencies
        run: mvn -B -ntp dependency:go-offline
      - name: Compile, test and package
        run: mvn -B -ntp clean verify

  frontend:
    name: Frontend - lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Frontend tests (if configured)
        run: npm run test --if-present
